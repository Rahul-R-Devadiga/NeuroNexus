<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="form-container">
      <h2>Contact Form</h2>

      
      <form action="#" method="get">
        <!--
          Using method="get" for local demonstration in a static HTML + CSS environment.
          In a real application, method="post" would be preferred to securely submit user data.
          No backend or JavaScript is involved as per assignment instructions.
        -->
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name" required />

        <label for="contact-number">Contact Number</label>
        <input type="tel" id="contact-number" name="contact-number" required />

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4" required></textarea>

        <label for="company-name">Company Name</label>
        <input type="text" id="company-name" name="company-name" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />

        <label for="department">Department</label>
        <select id="department" name="department" required>
          <option value="">-- Select Department --</option>
          <option value="hr">HR</option>
          <option value="sales">Sales</option>
          <option value="development">Development</option>
          <option value="marketing">Marketing</option>
          <option value="others">Others</option>
        </select>

        <label>Gender</label>
        <div class="radio-group">
          <label
            ><input type="radio" name="gender" value="male" required />
            Male</label
          >
          <label
            ><input type="radio" name="gender" value="female" /> Female</label
          >
          <label
            ><input type="radio" name="gender" value="prefer-not-to-say" />
            Prefer not to say</label
          >
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
